<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberShield · Three colour schemes</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body { background:#0E0E10; color:#F2F2F4; font-family:-apple-system,"SF Pro Display","Inter",system-ui,sans-serif; padding:44px 24px 80px; }
  .page { max-width:1300px; margin:0 auto; }
  .page > header { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:10px; flex-wrap:wrap; }
  .page h1 { font-size:32px; letter-spacing:-.03em; font-weight:800; }
  .page header p { color:#9A9AA2; font-size:15px; margin-top:8px; }
  .replay { border:0; background:#1E1E22; color:#F2F2F4; border-radius:999px; padding:10px 16px; font-weight:600; font-size:13px; font-family:inherit; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); }
  .replay:active { transform:scale(.96); }
  section.scheme { margin-top:54px; }
  .sh { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .sh h2 { font-size:24px; letter-spacing:-.025em; }
  .sh em { font-style:normal; color:#8E8E96; font-size:14px; }
  .scheme > p { color:#A4A4AC; font-size:14.5px; line-height:1.55; margin:8px 0 14px; max-width:820px; }
  .sw { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:26px; }
  .sw span { display:flex; align-items:center; gap:7px; font:500 11.5px/1 ui-monospace,Menlo,monospace; color:#B9B9C0; background:#1A1A1E; padding:6px 10px 6px 6px; border-radius:999px; }
  .sw i { width:16px; height:16px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(255,255,255,.15); }
  .row { display:flex; flex-wrap:wrap; justify-content:center; gap:40px; }

  /* ================= colour schemes ================= */
  /* 1 · Indigo Dusk: violet-indigo night with a periwinkle-to-lilac action colour. */
  .phone[data-scheme="dusk"] {
    --bg:#0B0A1A; --card:rgba(24,22,48,.72); --card2:#1C1A36; --ink:#F3F1FF; --ink2:#CFCBEA; --muted:#8C88AE; --dim:#5A5679;
    --line:rgba(190,180,255,.10); --track:rgba(190,180,255,.10);
    --accent:#8F7CFF; --accent2:#C3B5FF; --accentInk:#FFFFFF;
    --safe:#4EE1B4; --safe2:#8F7CFF; --warn:#FFC266; --warn2:#FF9F5A; --risk:#FF6B8B; --risk2:#FF9AAE;
    --glowA:rgba(143,124,255,.42); --glowB:rgba(78,225,180,.16); --riskA:rgba(255,107,139,.40); --riskB:rgba(143,124,255,.18);
    --hero1:#C3B5FF; --hero2:#8F7CFF; --hero3:#4EE1B4; --glowOn:1;
  }
  /* 2 · Pearl: light, near-white with ink buttons and soft sky/peach washes (Cal AI-like). */
  .phone[data-scheme="pearl"] {
    --bg:#F3F4F7; --card:rgba(255,255,255,.82); --card2:#FFFFFF; --ink:#0F1115; --ink2:#3A3D45; --muted:#80838D; --dim:#B4B7BF;
    --line:rgba(15,17,21,.07); --track:#ECEDF1;
    --accent:#0F1115; --accent2:#2B2F38; --accentInk:#FFFFFF;
    --safe:#12B886; --safe2:#38D9A9; --warn:#F59F00; --warn2:#FFC94D; --risk:#F03E3E; --risk2:#FF8787;
    --glowA:rgba(116,192,252,.55); --glowB:rgba(255,192,150,.55); --riskA:rgba(255,135,135,.55); --riskB:rgba(255,192,150,.55);
    --hero1:#0F1115; --hero2:#3D4FE0; --hero3:#12B886; --glowOn:0;
  }
  /* 3 · Emerald Gold: deep forest green with a warm gold action colour. */
  .phone[data-scheme="emerald"] {
    --bg:#04120D; --card:rgba(13,36,27,.74); --card2:#10291F; --ink:#F1F6EE; --ink2:#C7D6CC; --muted:#84A091; --dim:#4E6B5C;
    --line:rgba(200,240,210,.09); --track:rgba(200,240,210,.09);
    --accent:#E9C46A; --accent2:#F4DFA0; --accentInk:#1B1505;
    --safe:#52D69A; --safe2:#E9C46A; --warn:#FFA559; --warn2:#FFCB8E; --risk:#FF5E6C; --risk2:#FF9AA2;
    --glowA:rgba(233,196,106,.30); --glowB:rgba(82,214,154,.20); --riskA:rgba(255,94,108,.36); --riskB:rgba(255,165,89,.16);
    --hero1:#F4DFA0; --hero2:#E9C46A; --hero3:#52D69A; --glowOn:1;
  }

  /* ---------- device ---------- */
  .device { width:399px; height:836px; border-radius:62px; padding:12px; background:#1A1A1D; box-shadow:0 0 0 1.5px #2C2C31, 0 50px 90px -30px rgba(0,0,0,.9); }
  .phone { position:relative; width:375px; height:812px; border-radius:50px; overflow:hidden; background:var(--bg); color:var(--ink); isolation:isolate; }
  .glow { position:absolute; border-radius:50%; filter:blur(50px); z-index:-1; animation:drift 12s ease-in-out infinite; }
  .glow.a { width:330px; height:330px; top:-150px; right:-110px; background:radial-gradient(circle, var(--glowA), transparent 65%); }
  .glow.b { width:300px; height:300px; top:230px; left:-190px; background:radial-gradient(circle, var(--glowB), transparent 65%); animation-duration:15s; animation-direction:reverse; }
  .phone.risky .glow.a { background:radial-gradient(circle, var(--riskA), transparent 65%); }
  .phone.risky .glow.b { background:radial-gradient(circle, var(--riskB), transparent 65%); }
  @keyframes drift { 50% { transform:translate(-30px,26px) scale(1.12); } }

  .island { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:122px; height:35px; background:#000; border-radius:20px; z-index:50; }
  .status { position:absolute; top:0; left:0; right:0; height:52px; display:flex; align-items:center; justify-content:space-between; padding:6px 30px 0 40px; font:600 16px/1 -apple-system,system-ui,sans-serif; z-index:40; }
  .status .r { display:flex; gap:6px; align-items:center; font-size:13px; }
  .status svg { height:12px; fill:currentColor; }
  .content { position:absolute; inset:0; padding:62px 20px 110px; display:flex; flex-direction:column; gap:12px; }

  .card { background:var(--card); border-radius:26px; box-shadow:inset 0 0 0 1px var(--line); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
  .phone[data-scheme="pearl"] .card { box-shadow:inset 0 0 0 1px var(--line), 0 10px 30px rgba(20,24,40,.06); }
  svg.i { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }

  .bar { display:flex; align-items:center; gap:8px; height:44px; }
  .brand { display:flex; align-items:center; gap:9px; font-weight:800; font-size:20px; letter-spacing:-.03em; margin-right:auto; }
  .logo { width:30px; height:30px; border-radius:10px; background:linear-gradient(135deg,var(--accent2),var(--accent)); color:var(--accentInk); display:grid; place-items:center; box-shadow:0 0 18px color-mix(in srgb, var(--accent) calc(var(--glowOn) * 40%), transparent); }
  .logo svg.i { width:17px; height:17px; stroke-width:2.6; }
  .lang { display:flex; gap:2px; padding:3px; border-radius:999px; background:var(--card2); box-shadow:inset 0 0 0 1px var(--line); font-size:12.5px; font-weight:700; }
  .lang b { padding:6px 9px; border-radius:999px; color:var(--muted); cursor:pointer; transition:background .25s, color .25s; }
  .lang b.on { background:color-mix(in srgb, var(--accent) 22%, var(--card2)); color:var(--ink); }
  .round { width:40px; height:40px; border-radius:50%; border:0; background:var(--card2); color:var(--ink); display:grid; place-items:center; box-shadow:inset 0 0 0 1px var(--line); cursor:pointer; flex:none; transition:transform .2s; }
  .round:active { transform:scale(.9); }
  .title { flex:1; text-align:center; font-weight:700; font-size:17px; margin-right:40px; }

  h2.hero { font-size:41px; line-height:1.02; letter-spacing:-.045em; font-weight:800; margin:14px 0 8px; }
  h2.hero em { font-style:normal; display:block; background:linear-gradient(95deg,var(--hero1) 0%,var(--hero2) 55%,var(--hero3) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; background-size:200% 100%; animation:sheen 6s ease-in-out infinite; }
  @keyframes sheen { 50% { background-position:100% 0; } }

  .search { display:flex; align-items:center; gap:10px; padding:8px 8px 8px 20px; border-radius:999px; }
  .search .ph { flex:1; font-size:15.5px; color:var(--muted); white-space:nowrap; overflow:hidden; }
  .search .ph::after { content:""; display:inline-block; width:1.5px; height:17px; background:var(--accent); margin-left:2px; vertical-align:-3px; animation:caret 1s steps(1) infinite; }
  @keyframes caret { 50% { opacity:0; } }
  .go { width:46px; height:46px; border-radius:50%; border:0; background:linear-gradient(135deg,var(--accent2),var(--accent)); color:var(--accentInk); display:grid; place-items:center; cursor:pointer; animation:breathe 2.6s ease-out infinite; transition:transform .2s; }
  .go:active { transform:scale(.9); }
  .go svg.i { stroke-width:2.6; }
  @keyframes breathe { 0% { box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 70%,100% { box-shadow:0 0 0 12px color-mix(in srgb, var(--accent) 0%, transparent); } }

  .chips { display:flex; gap:8px; }
  .chip { flex:1; display:flex; align-items:center; justify-content:center; gap:7px; padding:12px 0; border-radius:999px; font-size:13.5px; font-weight:650; cursor:pointer; transition:transform .25s cubic-bezier(.3,1.6,.5,1); }
  .chip svg.i { width:17px; height:17px; color:var(--accent); }
  .phone[data-scheme="pearl"] .chip svg.i { color:#3D4FE0; }
  .chip:active { transform:scale(.94); }

  .month { display:flex; align-items:center; justify-content:space-between; padding:18px 18px 18px 20px; }
  .month small { font-size:13px; color:var(--muted); font-weight:600; }
  .num { font-size:52px; font-weight:750; letter-spacing:-.05em; line-height:1; font-variant-numeric:tabular-nums; margin:4px 0 8px; }
  .keys { display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:600; color:var(--muted); }
  .keys span { display:flex; align-items:center; gap:7px; }
  .keys i { width:8px; height:8px; border-radius:50%; }
  .keys b { color:var(--ink); font-variant-numeric:tabular-nums; }

  .ring { position:relative; display:grid; place-items:center; flex:none; }
  .ring svg { position:absolute; inset:0; overflow:visible; }
  .ring .p { filter:drop-shadow(0 0 5px color-mix(in srgb, var(--rc) calc(var(--glowOn) * 55%), transparent)); }
  .go-in .ring .p { animation:fill 1.6s cubic-bezier(.2,.85,.25,1) both; animation-delay:calc(var(--base,0ms) + 450ms); }
  @keyframes fill { from { stroke-dashoffset:var(--c); } }
  .ring .in { position:relative; text-align:center; line-height:1; }

  .list { padding:4px 0; }
  .item { display:flex; align-items:center; gap:13px; padding:11px 16px; cursor:pointer; }
  .item + .item { border-top:1px solid var(--line); }
  .item .ring .in { font-size:13px; font-weight:800; font-variant-numeric:tabular-nums; }
  .item .m { flex:1; min-width:0; }
  .item b { display:block; font-size:15px; font-weight:650; }
  .item small { display:block; font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .item .chev { color:var(--dim); }

  .tabs { position:absolute; left:18px; right:18px; bottom:24px; height:64px; padding:7px; border-radius:999px; display:flex; z-index:20; background:color-mix(in srgb, var(--card2) 78%, transparent); backdrop-filter:blur(24px) saturate(1.5); -webkit-backdrop-filter:blur(24px) saturate(1.5); box-shadow:inset 0 0 0 1px var(--line), 0 14px 40px rgba(0,0,0,.35); }
  .tabs .pill { position:absolute; top:7px; bottom:7px; left:7px; border-radius:999px; background:linear-gradient(135deg,var(--accent2),var(--accent)); box-shadow:0 0 22px color-mix(in srgb, var(--accent) calc(var(--glowOn) * 45%), transparent); transition:transform .5s cubic-bezier(.3,1.35,.45,1); }
  .tab { position:relative; flex:1; display:grid; place-items:center; color:var(--muted); cursor:pointer; transition:color .3s; }
  .tab.on { color:var(--accentInk); }
  .tab svg.i { width:22px; height:22px; }

  .verdict { padding:20px; display:flex; align-items:center; gap:16px; }
  .verdict .l { flex:1; }
  .verdict small { font-size:12.5px; color:var(--muted); font-weight:650; }
  .verdict h3 { font-size:36px; letter-spacing:-.045em; font-weight:800; color:var(--risk); margin:4px 0 6px; line-height:1; text-shadow:0 0 24px color-mix(in srgb, var(--risk) calc(var(--glowOn) * 45%), transparent); }
  .verdict p { font-size:14px; line-height:1.4; color:var(--ink2); }
  .verdict .ring .in { font-size:26px; font-weight:800; letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
  .verdict .ring .in .of { display:block; font-size:10px; letter-spacing:.08em; color:var(--muted); margin-top:3px; font-weight:700; }

  .msg { padding:16px 18px; font-size:14.5px; line-height:1.6; color:var(--ink2); }
  .msg mark { color:var(--ink); border-radius:5px; padding:0 2px; background:linear-gradient(color-mix(in srgb, var(--risk) 32%, transparent),color-mix(in srgb, var(--risk) 32%, transparent)) no-repeat 0 100% / 100% 100%; -webkit-box-decoration-break:clone; box-decoration-break:clone; }
  .msg mark.amb { background-image:linear-gradient(color-mix(in srgb, var(--warn) 32%, transparent),color-mix(in srgb, var(--warn) 32%, transparent)); }
  .go-in .msg mark { animation:hl .6s cubic-bezier(.6,.1,.2,1) both; animation-delay:calc(var(--base,0ms) + 900ms + var(--k,0) * 280ms); }
  @keyframes hl { from { background-size:0% 100%; } }

  .why { padding:4px 18px; }
  .why div { display:flex; gap:12px; padding:12px 0; }
  .why div + div { border-top:1px solid var(--line); }
  .why i { width:8px; height:8px; border-radius:50%; background:var(--risk); margin-top:6px; flex:none; box-shadow:0 0 10px color-mix(in srgb, var(--risk) calc(var(--glowOn) * 100%), transparent); }
  .why b { display:block; font-size:14px; font-weight:600; }
  .why q { display:block; font-size:12.5px; color:var(--muted); margin-top:3px; font-style:italic; }
  .why q::before, .why q::after { content:""; }

  .btn { width:100%; border:0; border-radius:999px; height:54px; font-weight:700; font-size:16px; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:9px; cursor:pointer; transition:transform .2s; }
  .btn:active { transform:scale(.97); }
  .btn.primary { background:linear-gradient(135deg,var(--accent2),var(--accent)); color:var(--accentInk); box-shadow:0 10px 30px color-mix(in srgb, var(--accent) 30%, transparent); }
  .btn.secondary { background:var(--card2); color:var(--ink); box-shadow:inset 0 0 0 1px var(--line); }
  .btn.link { background:none; color:var(--risk); height:30px; font-size:15px; }

  .pay { padding:20px; text-align:center; }
  .pay small { font-size:12.5px; color:var(--muted); font-weight:600; }
  .pay h4 { font-size:19px; letter-spacing:-.02em; margin-top:8px; }
  .pay code { font:500 12.5px/1 ui-monospace,Menlo,monospace; color:var(--muted); display:block; margin-top:6px; }
  .amt { font-size:58px; font-weight:750; letter-spacing:-.05em; margin:12px 0; font-variant-numeric:tabular-nums; line-height:1; }
  .note { display:inline-block; padding:8px 14px; border-radius:999px; background:var(--card2); box-shadow:inset 0 0 0 1px var(--line); font-size:13px; font-style:italic; color:var(--ink2); }
  .alert { display:flex; gap:12px; align-items:center; padding:14px 16px; background:linear-gradient(100deg, color-mix(in srgb, var(--risk) 16%, transparent), color-mix(in srgb, var(--risk) 5%, transparent)), var(--card); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--risk) 25%, transparent); }
  .alert p { font-size:13.5px; line-height:1.4; color:var(--ink); flex:1; }
  .alert b { color:var(--risk); }
  .alert .ring .in { font-size:13px; font-weight:800; color:var(--risk); }
  .pin { display:flex; gap:12px; align-items:flex-start; padding:14px 16px; font-size:13.5px; line-height:1.45; }
  .pin svg.i { color:var(--safe); margin-top:1px; }
  .pin span { display:block; color:var(--muted); font-size:13px; margin-top:2px; }

  .rise { opacity:0; transform:translateY(16px) scale(.985); filter:blur(4px); }
  .go-in .rise { animation:rise .75s cubic-bezier(.2,.9,.25,1.04) forwards; animation-delay:var(--d,0ms); }
  @keyframes rise { to { opacity:1; transform:none; filter:none; } }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; } }
</style>
</head>
<body>
<div class="page">
  <header>
    <div><h1>CyberShield · three colour schemes</h1>
      <p>Same layout as Midnight Rings. Only the colours change.</p></div>
    <button class="replay" id="replay">↻ Replay motion</button>
  </header>
  <div id="schemes"></div>
</div>

<script>
const SCHEMES = [
  { id:'dusk', name:'1 · Indigo Dusk', tag:'dark · violet and lilac',
    blurb:'A deep indigo night instead of pure black. The main button and rings use a periwinkle-to-lilac gradient, safe is mint, and risk is a soft rose so warnings stand out without feeling harsh.',
    sw:[['#0B0A1A','background'],['#8F7CFF','action'],['#C3B5FF','lilac'],['#4EE1B4','safe'],['#FFC266','suspicious'],['#FF6B8B','risk']] },
  { id:'pearl', name:'2 · Pearl', tag:'light · ink on white',
    blurb:'A bright, clean light mode close to Cal AI. Near-white background, white cards and near-black buttons, with soft sky-blue and peach washes behind the cards. The red wash appears only on risky results.',
    sw:[['#F3F4F7','background'],['#0F1115','action'],['#3D4FE0','accent'],['#12B886','safe'],['#F59F00','suspicious'],['#F03E3E','risk']] },
  { id:'emerald', name:'3 · Emerald Gold', tag:'dark · forest green and gold',
    blurb:'Deep forest green with a warm gold action colour. It feels premium and trustworthy, like a private bank card. Green is the natural colour for "safe", and the gold button stays easy to find.',
    sw:[['#04120D','background'],['#E9C46A','action'],['#F4DFA0','light gold'],['#52D69A','safe'],['#FFA559','suspicious'],['#FF5E6C','risk']] },
];

const P = {
  shield:'<path d="M12 3l7 3v6c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6l7-3z"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  qr:'<rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><path d="M14 14h2.5v2.5H14zM17.5 17.5H20V20h-2.5z"/>',
  img:'<rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9.5" cy="9.5" r="1.6"/><path d="M20 15.5l-4.5-4.5L6.5 20"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  msg:'<path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H9l-4 3.5V6a1 1 0 0 1 1-1z"/>',
  home:'<path d="M4 10.5L12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  sliders:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  phone:'<path d="M5 4h3.5l2 5-2.4 1.5a11 11 0 0 0 5.4 5.4L15 13.5l5 2V19a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
};
const ic = n => `<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;

// Ring gradients read the scheme's CSS variables, so one markup serves all three schemes.
const GR = { main:['--safe','--safe2'], warn:['--warn','--warn2'], risk:['--risk','--risk2'] };
let uid = 0;
function ring(size, sw, gap, items, inner = '') {
  const c0 = size / 2; let out = '', defs = '';
  items.forEach(([g, pct], k) => {
    const id = `g${uid++}`, r = (size - sw) / 2 - k * (sw + gap), c = 2 * Math.PI * r;
    defs += `<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(${GR[g][0]})"/><stop offset="1" style="stop-color:var(${GR[g][1]})"/></linearGradient>`;
    out += `<circle cx="${c0}" cy="${c0}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${sw}"/>
      <circle class="p" cx="${c0}" cy="${c0}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="${sw}" stroke-linecap="round"
      stroke-dasharray="${c}" transform="rotate(-90 ${c0} ${c0})" style="--c:${c};--rc:var(${GR[g][0]});stroke-dashoffset:${c * (1 - pct / 100)}"/>`;
  });
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><defs>${defs}</defs>${out}</svg><div class="in">${inner}</div></div>`;
}
const count = (to, fmt = '') => `<span class="count" data-to="${to}" data-fmt="${fmt}">0</span>`;

const chrome = (s, risky, inner, tab) => `
  <div class="phone ${risky ? 'risky' : ''}" data-scheme="${s}">
    <div class="glow a"></div><div class="glow b"></div>
    <div class="island"></div>
    <div class="status"><span>9:41</span><span class="r">5G
      <svg viewBox="0 0 26 12" style="width:26px"><rect x=".5" y=".5" width="22" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="2"/></svg></span></div>
    <div class="content">${inner}</div>
    <nav class="tabs" data-on="${tab}"><div class="pill"></div>
      ${['home','msg','link','qr','clock'].map((n, i) => `<div class="tab ${i === tab ? 'on' : ''}" data-i="${i}">${ic(n)}</div>`).join('')}
    </nav>
  </div>`;

const home = s => chrome(s, false, `
  <div class="bar rise"><div class="brand"><span class="logo">${ic('shield')}</span>CyberShield</div>
    <div class="lang"><b class="on">EN</b><b>हि</b><b>मरा</b></div><button class="round">${ic('sliders')}</button></div>
  <h2 class="hero rise">Check first.<em>Click with confidence.</em></h2>
  <div class="card search rise"><div class="ph" data-type>Paste a message or link</div><button class="go" aria-label="Check">${ic('arrow')}</button></div>
  <div class="chips rise"><div class="card chip">${ic('qr')}QR code</div><div class="card chip">${ic('img')}Screenshot</div><div class="card chip">${ic('link')}Link</div></div>
  <div class="card month rise">
    <div><small>This month</small><div class="num">${count(14)}</div>
      <div class="keys"><span><i style="background:var(--safe)"></i><b>10</b> safe</span><span><i style="background:var(--warn)"></i><b>3</b> suspicious</span><span><i style="background:var(--risk)"></i><b>1</b> high risk</span></div></div>
    ${ring(128, 14, 3, [['main', 71], ['warn', 21], ['risk', 7]])}
  </div>
  <div class="card list rise">
    <div class="item">${ring(44, 4, 0, [['risk', 92]], count(92))}<div class="m"><b>Message</b><small>KYC threat · 2h ago</small></div><span class="chev">${ic('chev')}</span></div>
    <div class="item">${ring(44, 4, 0, [['warn', 61]], count(61))}<div class="m"><b>Link</b><small>sbi-kyc-update.xyz · yesterday</small></div><span class="chev">${ic('chev')}</span></div>
  </div>`, 0);

const message = s => chrome(s, true, `
  <div class="bar rise"><button class="round">${ic('back')}</button><div class="title">Message</div></div>
  <div class="card verdict rise">
    <div class="l"><small>VERDICT</small><h3>High risk</h3><p>Don’t reply, share the OTP or open the link.</p></div>
    ${ring(96, 10, 0, [['risk', 100]], `${count(100)}<span class="of">/ 100</span>`)}
  </div>
  <div class="card msg rise">Dear customer, your SBI account <mark>will be blocked today</mark>. <mark>Share OTP</mark> 482913 and <mark class="amb">update KYC immediately</mark> at <mark>sbi-kyc-update.xyz</mark>/login</div>
  <div class="card why rise">
    <div><i></i><span><b>Asks for an OTP. Banks never do.</b><q>“Share OTP”</q></span></div>
    <div><i></i><span><b>SBI’s name on a domain SBI doesn’t own.</b><q>sbi-kyc-update.xyz</q></span></div>
  </div>
  <div class="rise" style="display:flex;flex-direction:column;gap:10px;margin-top:2px">
    <button class="btn primary">${ic('phone')}Call 1930</button><button class="btn secondary">Report on Chakshu</button>
  </div>`, 1);

const upi = s => chrome(s, true, `
  <div class="bar rise"><button class="round">${ic('back')}</button><div class="title">UPI request</div></div>
  <div class="card pay rise">
    <small>You would pay</small><h4>SBI Refund Desk</h4><code>refund.helpdesk@okaxis</code>
    <div class="amt">₹${count(49999, 'inr')}</div>
    <span class="note">“KYC refund, approve to receive”</span>
  </div>
  <div class="card alert rise">${ring(46, 4, 0, [['risk', 88]], count(88))}<p><b>Scanning this pays them.</b> It is not a refund.</p></div>
  <div class="card pin rise">${ic('lock')}<div>Your UPI PIN is only for sending money.<span>पैसे पाने के लिए UPI PIN कभी नहीं लगता।</span></div></div>
  <div class="rise" style="display:flex;flex-direction:column;gap:6px;margin-top:4px">
    <button class="btn primary">Don’t pay</button><button class="btn link">Open UPI app anyway</button>
  </div>`, 3);

const root = document.getElementById('schemes');
SCHEMES.forEach(sc => {
  const sec = document.createElement('section'); sec.className = 'scheme';
  sec.innerHTML = `<div class="sh"><h2>${sc.name}</h2><em>${sc.tag}</em></div><p>${sc.blurb}</p>
    <div class="sw">${sc.sw.map(([c, n]) => `<span><i style="background:${c}"></i>${c} ${n}</span>`).join('')}</div>
    <div class="row">${[home, message, upi].map(f => `<div class="device">${f(sc.id)}</div>`).join('')}</div>`;
  root.appendChild(sec);
});

// ---------- motion ----------
const fmt = (n, f) => f === 'inr' ? n.toLocaleString('en-IN') : String(n);
function countUp(el) {
  const to = +el.dataset.to, f = el.dataset.fmt, t0 = performance.now(), dur = 1400;
  const step = now => { const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4);
    el.textContent = fmt(Math.round(to * e), f); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function placeTab(nav) {
  const tabs = nav.querySelectorAll('.tab'), on = +nav.dataset.on, w = tabs[0].offsetWidth;
  const pill = nav.querySelector('.pill'); pill.style.width = w + 'px'; pill.style.transform = `translateX(${on * w}px)`;
  tabs.forEach((t, i) => t.classList.toggle('on', i === on));
}
function play() {
  document.querySelectorAll('.row').forEach(row => row.querySelectorAll('.phone').forEach((ph, pi) => {
    ph.classList.remove('go-in'); void ph.offsetWidth;
    ph.style.setProperty('--base', `${pi * 120}ms`);
    ph.querySelectorAll('.rise').forEach((el, i) => el.style.setProperty('--d', `${pi * 120 + i * 70}ms`));
    ph.querySelectorAll('mark').forEach((k, i) => k.style.setProperty('--k', i));
    ph.classList.add('go-in');
    ph.querySelectorAll('.count').forEach(el => { el.textContent = fmt(0, el.dataset.fmt); setTimeout(() => countUp(el), 450 + pi * 120); });
  }));
}
document.querySelectorAll('.tabs').forEach(nav => {
  placeTab(nav);
  nav.addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) { nav.dataset.on = t.dataset.i; placeTab(nav); } });
});
document.querySelectorAll('.lang').forEach(l => l.addEventListener('click', e => {
  const b = e.target.closest('b'); if (b) l.querySelectorAll('b').forEach(x => x.classList.toggle('on', x === b));
}));

// typewriter placeholder on every home search box
const lines = ['Paste a message or link', 'Your KYC expires today…', 'sbi-kyc-update.xyz', 'आपका खाता बंद हो जाएगा…'];
const sleep = ms => new Promise(r => setTimeout(r, ms));
document.querySelectorAll('[data-type]').forEach(async (ph, k) => {
  let li = 0; await sleep(k * 700);
  for (;;) {
    const s = lines[li++ % lines.length];
    for (let i = 0; i <= s.length; i++) { ph.textContent = s.slice(0, i); await sleep(45); }
    await sleep(1800);
    for (let i = s.length; i >= 0; i--) { ph.textContent = s.slice(0, i); await sleep(18); }
    await sleep(250);
  }
});
document.getElementById('replay').onclick = play;
setTimeout(play, 150);
</script>
