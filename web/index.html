<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CyberShield: check a message, link or QR code before you act</title>
  <meta name="description" content="Spot UPI fraud, phishing SMS, fake KYC messages, malicious links and fraudulent QR codes in English, Hindi and Marathi. Runs in your browser.">
  <meta name="theme-color" content="#2448F5">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/jsQR.js" defer></script>
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="./" aria-label="CyberShield home">
      <img src="favicon.svg" alt="" width="34" height="34">
      <span>CyberShield</span>
    </a>
    <div class="topbar-actions">
      <label class="lang">
        <span class="sr-only" data-i18n="language_title"></span>
        <select id="lang">
          <option value="en">English</option>
          <option value="hi">हिन्दी</option>
          <option value="mr">मराठी</option>
        </select>
      </label>
      <a id="get-app" class="btn btn-soft" hidden data-i18n="web_get_app"></a>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1 data-i18n="home_title"></h1>
      <p class="tagline" data-i18n="home_tagline"></p>
      <p class="note" data-i18n="web_demo_note"></p>
    </section>

    <nav class="tabs" role="tablist" aria-label="Checks">
      <button role="tab" id="tab-message" aria-controls="panel-message" aria-selected="true" data-tab="message">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H8l-4 4V6a2 2 0 0 1 2-2Z"/></svg>
        <span data-i18n="nav_message"></span>
      </button>
      <button role="tab" id="tab-link" aria-controls="panel-link" aria-selected="false" data-tab="link" tabindex="-1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" fill="none" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span data-i18n="nav_link"></span>
      </button>
      <button role="tab" id="tab-qr" aria-controls="panel-qr" aria-selected="false" data-tab="qr" tabindex="-1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h3v3h-3zM18 18h3v3h-3zM18 14h3v2h-3zM14 18h2v3h-2z"/></svg>
        <span data-i18n="nav_qr"></span>
      </button>
    </nav>

    <div class="workspace">
      <section class="panel card" id="panel-message" role="tabpanel" aria-labelledby="tab-message">
        <h2 data-i18n="nav_message"></h2>
        <p class="muted" data-i18n="scamlens_subtitle"></p>
        <textarea id="message-input" rows="7" maxlength="10000" data-i18n-placeholder="scamlens_hint" spellcheck="false"></textarea>
        <div class="row">
          <button class="btn btn-primary grow" id="message-go">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Z"/></svg>
            <span data-i18n="action_analyse_message"></span>
          </button>
          <button class="btn btn-soft" id="message-clear" data-i18n="action_clear"></button>
        </div>
        <div class="examples" id="message-examples"><span class="examples-title" data-i18n="web_examples"></span></div>
      </section>

      <section class="panel card" id="panel-link" role="tabpanel" aria-labelledby="tab-link" hidden>
        <h2 data-i18n="nav_link"></h2>
        <p class="muted" data-i18n="linkguard_subtitle"></p>
        <input id="link-input" type="text" inputmode="url" autocomplete="off" spellcheck="false" maxlength="4096" data-i18n-placeholder="linkguard_hint">
        <div class="row">
          <button class="btn btn-primary grow" id="link-go">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Z"/></svg>
            <span data-i18n="action_check_link"></span>
          </button>
          <button class="btn btn-soft" id="link-clear" data-i18n="action_clear"></button>
        </div>
        <div class="examples" id="link-examples"><span class="examples-title" data-i18n="web_examples"></span></div>
      </section>

      <section class="panel card" id="panel-qr" role="tabpanel" aria-labelledby="tab-qr" hidden>
        <h2 data-i18n="nav_qr"></h2>
        <p class="muted" data-i18n="qr_subtitle"></p>
        <div class="camera" id="camera" hidden>
          <video id="camera-video" playsinline muted></video>
          <div class="camera-frame" aria-hidden="true"></div>
        </div>
        <div class="row">
          <button class="btn btn-primary grow" id="camera-toggle">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Zm8 3.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/></svg>
            <span data-i18n="web_camera_start"></span>
          </button>
          <label class="btn btn-soft grow file">
            <input type="file" id="qr-file" accept="image/*">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm1 12h14l-4.5-6-3.5 4.5-2.5-3L5 17Z"/></svg>
            <span data-i18n="qr_from_image"></span>
          </label>
        </div>
        <p class="muted small" data-i18n="qr_camera_rationale"></p>
        <p class="status" id="qr-status" role="status"></p>
        <label class="field-label" for="qr-input" data-i18n="web_qr_paste"></label>
        <textarea id="qr-input" rows="2" spellcheck="false" maxlength="4096" placeholder="upi://pay?pa=…"></textarea>
        <div class="row">
          <button class="btn btn-soft grow" id="qr-go" data-i18n="web_check_qr"></button>
        </div>
        <div class="examples" id="qr-examples"><span class="examples-title" data-i18n="web_examples"></span></div>
      </section>

      <section class="panel result-area" id="result" aria-live="polite">
        <div class="placeholder card">
          <img src="favicon.svg" alt="" width="64" height="64">
          <p data-i18n="web_privacy"></p>
        </div>
      </section>
    </div>

    <section class="tips card">
      <h2 class="eyebrow" data-i18n="section_tips"></h2>
      <ul id="tips"></ul>
    </section>
  </main>

  <footer class="footer">
    <p class="helpline" data-i18n="helpline"></p>
    <p data-i18n="web_privacy"></p>
    <p class="small">
      <a href="https://sancharsaathi.gov.in/sfc/" target="_blank" rel="noopener noreferrer">Chakshu (Sanchar Saathi)</a> ·
      <a href="https://cybercrime.gov.in/" target="_blank" rel="noopener noreferrer">cybercrime.gov.in</a>
    </p>
  </footer>

  <dialog id="dialog" class="card">
    <form method="dialog" class="dialog-body" id="dialog-body"></form>
  </dialog>
</body>
</html>
